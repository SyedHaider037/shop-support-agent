# Guardrail rules, kept out of code so they can be reviewed and tuned without a deploy.
# Patterns are Python regular expressions, matched case-insensitively against each user
# message after control characters are stripped and whitespace is collapsed.
# Every rule id is recorded in the trace when it fires, so keep ids stable.

[limits]
max_messages = 20
max_message_chars = 1000

[refusals]
input = "Sorry, I can't help with that. I can answer questions about our products, orders, delivery and refunds."
output_leak = "Sorry, I can't share that. I can help with questions about our products, orders, delivery and refunds."
action_claim = "Sorry, nothing has been submitted or saved yet. For a refund, please share the order ID, the email used for the order and the reason, and I will send it to our team for review."

[[input_patterns]]
id = "ignore_instructions"
pattern = '''\b(ignore|disregard|forget|override|bypass)\b.{0,40}\b(previous|prior|above|earlier|all|your|system)\b.{0,20}\b(instructions?|rules|prompts?|directions|guidelines|polic(y|ies))\b'''

[[input_patterns]]
id = "you_are_now"
pattern = '''\byou\s+are\s+now\s+(an?\s+|in\s+|no\s+longer\b|free\b|unrestricted\b|unfiltered\b|jailbroken\b|dan\b)'''

[[input_patterns]]
id = "developer_mode"
pattern = '''\b(developer|dev|god|debug|admin|jailbreak|dan)\s+mode\b'''

[[input_patterns]]
id = "no_rules"
pattern = '''\b(pretend|imagine|act\s+as\s+if|behave\s+as\s+if|assume)\b.{0,40}\b(no|without|zero)\s+(rules|restrictions|limits|guidelines|filters|polic(y|ies))\b'''

[[input_patterns]]
id = "reveal_prompt"
pattern = '''\b(reveal|print|repeat|output|dump|leak|recite|show|tell|give|display|write\s+out)\b.{0,40}\b(your|the)\s+((system|initial|original|hidden|secret|internal|full)\s+)?(system\s+prompt|prompt|instructions|guidelines)\b(?!\s+(for|on|to)\b)'''

[[input_patterns]]
id = "system_prompt_mention"
pattern = '''\bsystem\s+(prompt|message|instructions)\b'''

[output]
# A reply containing this many consecutive words from policy.md is treated as a prompt
# leak and replaced. Six is long enough that ordinary support phrasing rarely matches.
leak_ngram_words = 6
# Sentences the policy tells the agent to say to customers. Word runs inside these
# are not leaks; without this list the agent would be refused for following its policy.
allowed_policy_phrases = [
    "a human from the support team will follow up",
    "could not find an order matching that order ID and email",
    "Would you like me to save your name and email so our team can contact you?",
    "the order ID and the email address used for the order",
    "can only help with shop questions",
    "products, orders, delivery, returns and refunds, and contacting the support team",
    "a human from the support team will follow up, and that it is not approved yet",
    "Only orders delivered in the last 30 days, with no earlier request, are eligible.",
]

# First-person claims that the agent DID something, checked on the final reply. The server
# keeps no memory, so only a successful write tool call (request_refund or capture_lead
# returning ok) in THIS request can back such a claim. Rules with always = true are replaced
# even then: the agent can never approve or pay a refund. Conditional wording ("once I've
# submitted it") is not a claim, hence the lookbehinds.
[[action_claims]]
id = "claimed_submitted"
pattern = '''(?<!once )(?<!when )(?<!after )(?<!if )\bI(?:'ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:submitted|created|sent|filed|logged|raised|placed|forwarded|passed on)\b'''

[[action_claims]]
id = "claimed_saved"
pattern = '''(?<!once )(?<!when )(?<!after )(?<!if )\bI(?:'ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:saved|recorded|captured|noted down)\b'''

[[action_claims]]
id = "claimed_approved"
pattern = '''(?<!once )(?<!when )(?<!after )(?<!if )\bI(?:'ve| have)?\s+(?:just\s+|now\s+|already\s+)?(?:approved|processed|refunded|issued)\b'''
always = true
